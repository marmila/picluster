---
# Export SMART data of every node's physical disk (wear, health, media and CRC
# errors) as Prometheus metrics through the node-exporter textfile collector,
# every 15 minutes.
# Read by:
# - node1: host node_exporter (prometheus.prometheus.node_exporter role, whose
#   default textfile directory is /var/lib/node_exporter)
# - k3s nodes: node-exporter DaemonSet (hostPath mount, kube-prometheus-stack values)
# Alerts: kube-prometheus-stack/k3s-mixins/base/rules/node-smart-rules.yaml

# No recommends: smartmontools recommends a mail transport (postfix).
- name: Install smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

# smartd would also scan the Longhorn iSCSI disks and try to send mail;
# Prometheus does the monitoring. Masked, not only disabled: apt starts it on
# install/upgrade, and on node1 (USB disk) it finds no device, exits 17 and stays
# "failed", which fires NodeSystemdServiceFailed (2026-11-22).
- name: Disable and mask smartd
  ansible.builtin.systemd_service:
    name: smartmontools
    enabled: false
    masked: true
    state: stopped

- name: Check whether smartd is in failed state
  ansible.builtin.command: systemctl is-failed --quiet smartmontools.service
  register: smartd_failed
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; its rc is needed in --check runs too

- name: Clear smartd failed state
  ansible.builtin.command: systemctl reset-failed smartmontools.service
  when: smartd_failed.rc == 0
  changed_when: true

- name: Create node-exporter textfile directory
  # No owner or mode: on node1 the node_exporter role owns this directory.
  ansible.builtin.file:  # noqa risky-file-permissions
    path: /var/lib/node_exporter
    state: directory

- name: Copy SMART metrics script
  ansible.builtin.copy:
    src: scripts/smart_metrics
    dest: /usr/local/bin/smart_metrics
    owner: root
    group: root
    mode: "0755"

- name: Create SMART metrics service
  ansible.builtin.copy:
    dest: /etc/systemd/system/smart-metrics.service
    content: |
      # Managed by Ansible (basic_setup/tasks/smart_metrics.yml)
      [Unit]
      Description=Export disk SMART data for node-exporter

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/smart_metrics
    owner: root
    group: root
    mode: "0644"

- name: Create SMART metrics timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/smart-metrics.timer
    content: |
      # Managed by Ansible (basic_setup/tasks/smart_metrics.yml)
      [Unit]
      Description=Export disk SMART data every 15 minutes

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=15min
      AccuracySec=30s

      [Install]
      WantedBy=timers.target
    owner: root
    group: root
    mode: "0644"

- name: Enable and start SMART metrics timer
  ansible.builtin.systemd_service:
    name: smart-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
