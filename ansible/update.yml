---
# OS package upgrade (make os-upgrade), one node at a time.
#
# Order: k3s workers, then k3s masters, then hosts outside k3s (node1: Vault,
# RustFS, DNS, HAProxy). pimaster is the ansible-runner container (local
# connection), updated by rebuilding its image, not with apt.
#
# When a node needs a reboot (/var/run/reboot-required), a k3s node is drained
# first, uncordoned once it is Ready again, and the run waits until no Longhorn
# volume is degraded before the next node. Before every node, all nodes must be
# Ready and schedulable and no Longhorn volume degraded or faulted. Details in
# tasks/os_upgrade_node.yml and homelab-docs/node-os-maintenance.md.
#
# Dry run: make os-upgrade-check (--check --diff). Upgrades nothing, drains and
# reboots nothing; runs the read-only checks and reports per node what a real
# run would do.
#
# Any failure stops the whole run (max_fail_percentage 0 + any_errors_fatal),
# so the masters are never touched after a worker failed.

- name: Upgrade k3s workers
  hosts: k3s_worker
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  become: true
  gather_facts: false
  tasks:
    - name: Upgrade the node, reboot it safely if needed
      ansible.builtin.include_tasks: tasks/os_upgrade_node.yml

- name: Upgrade k3s masters
  hosts: k3s_master
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  become: true
  gather_facts: false
  tasks:
    - name: Upgrade the node, reboot it safely if needed
      ansible.builtin.include_tasks: tasks/os_upgrade_node.yml

- name: Upgrade hosts outside k3s
  hosts: picluster:!k3s_cluster
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  become: true
  gather_facts: false
  tasks:
    - name: Upgrade the node, reboot it safely if needed
      ansible.builtin.include_tasks: tasks/os_upgrade_node.yml
