---
# Wait until no Longhorn volume is degraded or faulted (after a node came back).
#
# Input: k3s_maint_kubectl_host; k3s_maint_longhorn_retries (default 360 x 20 s
# = 2 h: Longhorn here rebuilds one replica per node at a time, as full copies).
# Used by move_rancher_to_storage.yml. os_upgrade_node.yml has the same wait
# inline; it will switch to this file with the os-upgrade improvements.

- name: Longhorn | Wait until no volume is degraded
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - longhorn-system
      - get
      - volumes.longhorn.io
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name} {.status.robustness}{"\n"}{end}'
  delegate_to: "{{ k3s_maint_kubectl_host }}"
  register: k3s_maint_volumes_after
  until: k3s_maint_volumes_after.stdout_lines | select('match', '.* (degraded|faulted)$') | list | length == 0
  retries: "{{ k3s_maint_longhorn_retries | default(360) }}"
  delay: 20
  changed_when: false
