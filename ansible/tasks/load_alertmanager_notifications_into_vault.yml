---
# Alertmanager notification URLs (ntfy topic + healthchecks.io ping URL).
# They contain the secret part (topic name, check UUID), are provided by hand
# through 'make secret-files' and cannot be generated by Terraform.

- name: Read Alertmanager notifications file from localhost
  ansible.builtin.set_fact:
    alertmanager_notifications_content: "{{ lookup('file', alertmanager_notifications_file) }}"
  no_log: true

- name: Set Alertmanager notification URL facts from file
  ansible.builtin.set_fact:
    alertmanager_ntfy_url: "{{ (alertmanager_notifications_content | regex_search('(?m)^\\s*ntfy_url\\s*=\\s*(\\S+)\\s*$', '\\1') | first) | default('') }}"
    alertmanager_healthchecks_url: "{{ (alertmanager_notifications_content | regex_search('(?m)^\\s*healthchecks_url\\s*=\\s*(\\S+)\\s*$', '\\1') | first) | default('') }}"
  no_log: true

- name: Validate Alertmanager notifications file
  ansible.builtin.assert:
    that:
      - alertmanager_ntfy_url is match('https://')
      - alertmanager_healthchecks_url is match('https://')
    fail_msg: |
      Alertmanager notifications file is incomplete or invalid.

      Run 'make secret-files' first to create it:
        {{ alertmanager_notifications_file }}

      Required keys (both https:// URLs):
        ntfy_url = https://ntfy.sh/<topic>?template=alertmanager
        healthchecks_url = https://hc-ping.com/<check-uuid>
    quiet: true

- name: Create/update alertmanager/notifications in Vault
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    validate_certs: "{{ not (enable_letsencrypt | default(false)) }}"
    ca_cert: "{{ vault_cacert | default(omit) }}"
    path: "secret/data/alertmanager/notifications"
    data:
      data:
        ntfy_url: "{{ alertmanager_ntfy_url }}"
        healthchecks_url: "{{ alertmanager_healthchecks_url }}"
  no_log: true
