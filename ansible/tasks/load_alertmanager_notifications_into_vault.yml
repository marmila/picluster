---
# Alertmanager notification URLs (ntfy topic + healthchecks.io ping URL).
# They contain the secret part (topic name, check UUID), are provided by hand
# through 'make secret-files' and cannot be generated by Terraform.

- name: Read Alertmanager notifications file from localhost
  ansible.builtin.set_fact:
    alertmanager_notifications_content: "{{ lookup('file', alertmanager_notifications_file) }}"
  no_log: true

- name: Set Alertmanager notification URL facts from file
  ansible.builtin.set_fact:
    alertmanager_ntfy_url: "{{ (alertmanager_notifications_content | regex_search('(?m)^\\s*ntfy_url\\s*=\\s*(\\S+)\\s*$', '\\1') | first) | default('') }}"
    alertmanager_healthchecks_url: "{{ (alertmanager_notifications_content | regex_search('(?m)^\\s*healthchecks_url\\s*=\\s*(\\S+)\\s*$', '\\1') | first) | default('') }}"
  no_log: true

- name: Validate Alertmanager notifications file
  ansible.builtin.assert:
    that:
      - alertmanager_ntfy_url is match('https://')
      - alertmanager_healthchecks_url is match('https://')
    fail_msg: |
      Alertmanager notifications file is incomplete or invalid.

      Run 'make secret-files' first to create it:
        {{ alertmanager_notifications_file }}

      Required keys (both https:// URLs):
        ntfy_url = https://ntfy.sh/<topic>?template=alertmanager
        healthchecks_url = https://hc-ping.com/<check-uuid>
    quiet: true

# Compact alert template (homelab-docs/alerting.md "Message size"). ntfy's built-in
# ?template=alertmanager prints receiver, start time and the long Prometheus source URL for
# every alert: 4 alerts in one group pass 4096 bytes, ntfy answers HTTP 400 and Alertmanager
# drops the notification; around 3 KB Android push already cuts the text. This inline template
# (tpl=yes, t=title, m=message) prints summary, labels, the description cut to 300 characters
# and the runbook ID; with max_alerts: 5 in Alertmanager a message stays around 2 KB.
# Replaces any template/tpl/title/message parameter already in ntfy_url, so the ini can keep
# ?template=alertmanager. !unsafe: the {{ }} are ntfy (Go) templates, not Jinja.
- name: Use the compact alert template in the ntfy URL
  ansible.builtin.set_fact:
    alertmanager_ntfy_url: >-
      {{ alertmanager_ntfy_url.split('?')[0] ~ '?' ~ (
           ((alertmanager_ntfy_url.split('?', 1)[1].split('&') if '?' in alertmanager_ntfy_url else [])
            | reject('match', '(template|tpl|title|message|t|m)=') | reject('equalto', '') | list)
           + ['tpl=yes',
              't=' ~ (alertmanager_ntfy_title_tpl | urlencode | replace('/', '%2F')),
              'm=' ~ (alertmanager_ntfy_message_tpl | urlencode | replace('/', '%2F'))]
         ) | join('&') }}
  vars:
    alertmanager_ntfy_title_tpl: !unsafe >-
      {{if eq .status "resolved"}}✅ Resolved:{{else}}🚨{{end}} {{.commonLabels.alertname}}{{with .commonLabels.severity}} [{{.}}]{{end}}{{if or (gt (len .alerts) 1) .truncatedAlerts}} ({{len .alerts}}{{with .truncatedAlerts}}+{{.}}{{end}}){{end}}
    alertmanager_ntfy_message_tpl: !unsafe |-
      {{range .alerts}}{{if eq .status "firing"}}🔥{{else}}✅{{end}} {{with .annotations.summary}}{{.}}{{else}}{{.labels.alertname}}{{end}}
      {{with .labels.namespace}}ns={{.}} {{end}}{{with .labels.node}}node={{.}} {{end}}{{with .labels.pod}}pod={{.}} {{end}}{{with .labels.instance}}instance={{.}}{{end}}
      {{with .annotations.description}}{{trunc 300 .}}
      {{end}}{{with .annotations.runbook}}Runbook: {{.}}
      {{else}}{{with .annotations.runbook_url}}Runbook: {{.}}
      {{end}}{{end}}
      {{end}}{{with .truncatedAlerts}}+{{.}} more not listed (see Alertmanager).{{end}}
  no_log: true

# Triage button (homelab-docs/sre-triage-agent.md 6.8): ntfy takes publish options as query
# parameters, so the button is an 'actions=' parameter on ntfy_url, pointing at the agent's
# command topic from sre-triage.ini. Added here, not in the ini, so the command topic is kept
# in one place. Skipped when there is no sre-triage.ini (no agent) or the URL has actions already.
- name: Check SRE triage file for the Triage button
  ansible.builtin.stat:
    path: "{{ sre_triage_file }}"
  register: alertmanager_sre_triage_stat

- name: Read the triage command topic
  ansible.builtin.set_fact:
    alertmanager_triage_command_url: >-
      {{ lookup('file', sre_triage_file)
         | regex_findall('(?m)^\s*ntfy_command_url\s*=\s*(https://\S+)\s*$')
         | default([''], true) | first }}
  when: alertmanager_sre_triage_stat.stat.exists
  no_log: true

# Same encoding as urllib.parse.quote(safe=''): Jinja's urlencode leaves '/' as is.
- name: Add the Triage button to the ntfy URL
  ansible.builtin.set_fact:
    alertmanager_ntfy_url: >-
      {{ alertmanager_ntfy_url ~ ('&' if '?' in alertmanager_ntfy_url else '?') ~ 'actions='
         ~ (('http, Triage, ' ~ alertmanager_triage_command_url ~ ', method=POST, body=triage')
            | urlencode | replace('/', '%2F')) }}
  when:
    - alertmanager_triage_command_url | default('') is match('https://')
    - "'actions=' not in alertmanager_ntfy_url"
  no_log: true

- name: Create/update alertmanager/notifications in Vault
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    validate_certs: "{{ not (enable_letsencrypt | default(false)) }}"
    ca_cert: "{{ vault_cacert | default(omit) }}"
    path: "secret/data/alertmanager/notifications"
    data:
      data:
        ntfy_url: "{{ alertmanager_ntfy_url }}"
        healthchecks_url: "{{ alertmanager_healthchecks_url }}"
  no_log: true
