name: Build fluentd image

on:
  push:
    branches: [master]
    paths:
      - docker/fluentd/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fluentd can be scheduled on any node: 2 amd64 (node-esp-*) and 5 arm64 (Pis)
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: docker/fluentd
          platforms: linux/amd64,linux/arm64
          push: true
          # New tag per Fluentd version: values.yaml pins it (pullPolicy Always), so a rebuild
          # never changes the running image behind the cluster's back. Bump both together.
          tags: ghcr.io/marmila/fluentd-aggregator:v1.20.1-kafka
