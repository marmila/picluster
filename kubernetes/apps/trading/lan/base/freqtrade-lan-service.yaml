# FreqUI on the LAN only: http://freqtrade.${CLUSTER_DOMAIN}
# The IP comes from the Cilium LB pool and is NOT forwarded by the router, so it is
# reachable only from the home network or over WireGuard. No public route on purpose:
# Envoy's OIDC filter strips the Authorization header FreqUI uses for its own API login.
apiVersion: v1
kind: Service
metadata:
  name: freqtrade-lan
  namespace: trading
  annotations:
    io.cilium/lb-ipam-ips: ${FREQTRADE_LOAD_BALANCER_IP}
    external-dns.kubernetes.io/hostname: freqtrade.${CLUSTER_DOMAIN}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: freqtrade
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
