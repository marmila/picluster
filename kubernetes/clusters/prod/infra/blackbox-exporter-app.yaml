---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blackbox-exporter-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-prom-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # ServiceMonitor/PrometheusRule CRDs and the kube-prom-stack namespace
    - name: kube-prometheus-stack-app
  path: ./kubernetes/platform/blackbox-exporter/app/overlays/prod
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
