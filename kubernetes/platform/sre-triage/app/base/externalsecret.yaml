# Vault secret/sre-triage: created by hand (homelab-docs/sre-triage-agent.md 6.1) or by
# 'make load-external-services-keys' from ~/.secrets/sre-triage.ini.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-triage
  namespace: sre-triage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sre-triage
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: sre-triage
        property: claude_oauth_token
    - secretKey: NTFY_COMMAND_URL
      remoteRef:
        key: sre-triage
        property: ntfy_command_url
    - secretKey: NTFY_REPLY_URL
      remoteRef:
        key: sre-triage
        property: ntfy_reply_url
