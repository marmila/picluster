apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: full
spec:
  schedule: "0 2 * * *"
  template:
    hooks: {}
    includedNamespaces:
    - '*'
    # threatmap disabled 2026-11-22 (suspended, scaled to 0): no backup of its
    # namespace or MongoDB volume. Remove to back it up again after re-enabling.
    excludedNamespaces:
    - threatmap
    includedResources:
    - '*'
    includeClusterResources: true
    metadata:
      labels:
        type: 'full'
        schedule: 'daily'
    ttl: 72h0m0s
