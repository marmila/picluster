apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan-gateway
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: ${LAN_GATEWAY_LOAD_BALANCER_IP}
  listeners:
    # http only carries the redirect route below (same namespace)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          # same wildcard certificate as public-gateway (*.${CLUSTER_DOMAIN}, Let's Encrypt)
          - kind: Secret
            name: pi-cluster-tls
