apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lan-https-redirect
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: lan-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
