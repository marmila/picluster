# One GrafanaFolder per dashboard folder, with a fixed UID.
# Dashboards point at these with spec.folderUID instead of spec.folder (title).
# With spec.folder the operator creates the folder on the fly, and dashboards synced
# at the same moment (after a restart) each created their own copy: duplicate folders.
# folderUID works across namespaces, so dashboards in any namespace can use these.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: folder-backup
spec:
  title: Backup
  uid: backup
  instanceSelector:
    matchLabels:
      dashboards: grafana
---
