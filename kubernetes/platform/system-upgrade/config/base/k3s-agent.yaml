apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  serviceAccountName: system-upgrade
  # Wait for k3s-server upgrade plan to complete before executing k3s-agent plan
  prepare:
    image: rancher/k3s-upgrade
    args:
      - prepare
      - k3s-server
  concurrency: 1
  # Agent jobs are created together with the server jobs and the prepare step
  # waits until every server runs the new version. That wait counts against
  # the deadline, and the servers alone take ~25 min on Pis, so 1800s killed
  # the first agent job before it started (2026-09-27 node6, 2026-11-07 node5).
  # A failed job is never retried. See runbook CLUSTER-015.
  jobActiveDeadlineSecs: 7200
  # Cordon node before upgrade it
  cordon: true
  upgrade:
    image: rancher/k3s-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.37.2+k3s1