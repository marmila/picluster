# longhorn helm values (base)

# Storage and core behavior
# See: https://longhorn.io/docs/1.10.0/advanced-resources/deploy/customizing-default-settings
defaultSettings:
  # Where Longhorn stores data on each node
  defaultDataPath: "/storage"

  # Limit how much rebuild/restore work a single node does in parallel.
  # This reduces CPU spikes from replica rebuilds and volume restores,
  # at the cost of slower recovery when many volumes need work.
  concurrentReplicaRebuildPerNodeLimit: 1
  concurrentVolumeBackupRestorePerNodeLimit: 1

  # Avoid aggressive fast-rebuild behavior; prefer lower background churn.
  fastReplicaRebuildEnabled: false

  # Upgrade volume engines to the current engine image automatically after a Longhorn upgrade,
  # one volume per node at a time. Without it (default 0) volumes stay on the old engine, the old
  # instance-manager stays alive next to the new one, and each reserves ~480m CPU. On node-esp-2
  # (4 vCPU) the second one cannot be scheduled (OutOfcpu), so any volume restarting there cannot
  # attach (Elasticsearch down 2026-11-12, same in 2026-09).
  concurrentAutomaticEngineUpgradePerNodeLimit: 1

  # Velero takes a CSI "bak" snapshot of every PVC at 02:00. Without this, the local snapshot stays
  # on the volume after the upload to RustFS (Prometheus: 6 snapshots / 110 GB on a 50 GB volume,
  # 2026-11-14), and every replica rebuild has to copy it. Restores read from RustFS, not from it.
  autoCleanupSnapshotAfterOnDemandBackupCompleted: true

  # Threshold below which a node's disk is marked unschedulable.
  # Lowered from the 25% default to 10% to tolerate the snapshot overhead
  # from daily Velero backups (3 snapshots × replica count per node).
  storageMinimalAvailablePercentage: 10