---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
spec:
  url: https://grafana.github.io/helm-charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 30m
  # Default 5m wait is too tight for tempo-compactor's real startup cost (60s ring
  # stability wait + blocklist poll) under load; without this the upgrade times out
  # before the pod ever proves healthy, triggering rollback remediation instead.
  timeout: 10m
  chart:
    spec:
      chart: tempo-distributed
      version: 1.61.3
      sourceRef:
        kind: HelmRepository
        name: grafana
  releaseName: tempo
  targetNamespace: tempo
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: tempo-helm-values
    valuesKey: base-values.yaml