---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
spec:
  url: https://grafana.github.io/helm-charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 30m
  # Default 5m wait is too tight for tempo-compactor's real startup cost (60s ring
  # stability wait + blocklist poll) under load; without this the upgrade times out
  # before the pod ever proves healthy, triggering rollback remediation instead.
  timeout: 20m
  chart:
    spec:
      chart: tempo-distributed
      version: 1.61.3
      sourceRef:
        kind: HelmRepository
        name: grafana
  releaseName: tempo
  targetNamespace: tempo
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: tempo-helm-values
    valuesKey: base-values.yaml
  # compactor.livenessProbe is not honored by this chart version as a values override
  # (confirmed: Deployment stayed on rollout revision 1 across every Helm upgrade
  # attempt with that key set). Patch the rendered manifest directly instead.
  #
  # failureThreshold: 90 (60s delay + 90*10s = 960s budget) - the compactor's initial
  # blocklist poll measured at 294s alone (67971 objects / 2.6GB backlog, accumulated
  # while it was crash-looping and never completing a compaction pass), before any
  # actual compaction work. Once it completes one pass the backlog should shrink and
  # steady-state polls return to ~46s; this budget covers the one-time catch-up.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: tempo-compactor
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
                value: 90