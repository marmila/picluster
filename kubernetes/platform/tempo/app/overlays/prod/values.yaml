# tempo helm values (prod overlay)

# Resource limits — none previously set, all components unbounded
# ingester-1 uses up to 631Mi, others under 100Mi

ingester:
  replicas: 1
  config:
    replication_factor: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

compactor:
  # 512Mi/200m was sized for steady-state; the first compaction pass after a long
  # crash-loop backlog (67971 objects / 2.6GB, never compacted) needs real headroom.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

distributor:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

querier:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

queryFrontend:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

metricsGenerator:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
