# kube-prometheus-stack helm values (prod overlay)
prometheus:
  prometheusSpec:
    ## Prod runs ~750k active series. Steady state fits in ~1.7Gi, but WAL replay
    ## after a restart needs noticeably more; 1800Mi caused an OOM crash loop
    ## after node reboots (2026-10-25). Keep ~2x headroom over steady state.
    resources:
      requests:
        cpu: 100m
        memory: 2Gi
      limits:
        memory: 4Gi
    ## Prefer the amd64 nodes (node-esp-1/2). Preferred, not required: if both are down,
    ## Prometheus still starts on a Pi instead of staying Pending. 2026-11-14: a drain of
    ## node-esp-1/2 put it on node6, where WAL replay + Longhorn rebuild drove load to 55
    ## and the node went NotReady (homelab-docs/node-os-maintenance.md 3.5).
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values: ["amd64"]
