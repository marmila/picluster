---
# Webhook URLs for Alertmanager receivers. They contain the secret part
# (ntfy topic, healthchecks.io check UUID), so they live in Vault, not git.
# Create once with:
#   vault kv put secret/alertmanager/notifications ntfy_url=... healthchecks_url=...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifications-externalsecret
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-notifications
  data:
  - secretKey: ntfy_url
    remoteRef:
      key: alertmanager/notifications
      property: ntfy_url
  - secretKey: healthchecks_url
    remoteRef:
      key: alertmanager/notifications
      property: healthchecks_url
