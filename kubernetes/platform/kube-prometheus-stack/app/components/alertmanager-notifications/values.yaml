# Send alerts somewhere. Without this, the chart default routes every alert
# (including Watchdog) to the "null" receiver and nobody is notified.
#
# - Watchdog (always firing) -> healthchecks.io every minute. If the pings stop,
#   healthchecks.io alerts: the dead-man's switch for the whole alerting chain.
# - severity=info -> dropped.
# - everything else (warning, critical) -> ntfy.
alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/<secret-name>/<key>
    secrets:
      - alertmanager-notifications
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ntfy
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: healthchecks
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - receiver: "null"
          matchers:
            - severity = "info"
    inhibit_rules:
      # A critical alert hides the warning version of the same alert.
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['namespace', 'alertname']
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notifications/ntfy_url
            send_resolved: true
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notifications/healthchecks_url
            send_resolved: false
    templates:
      - /etc/alertmanager/config/*.tmpl
