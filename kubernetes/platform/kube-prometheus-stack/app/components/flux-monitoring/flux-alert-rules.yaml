# Alerts when Flux cannot apply what is in Git: a failed HelmRelease upgrade,
# a broken Kustomization, a source Flux cannot fetch, or Flux itself not
# installable. These are what fire after a bad update is merged (by hand or by
# Renovate automerge). Routed to ntfy by alertmanager-notifications.
#
# Built on the gotk_resource_info metrics defined in values.yaml
# (kube-state-metrics customResourceState). label_replace copies
# exported_namespace to namespace so Alertmanager groups per namespace.
# Resources only waiting on a broken dependency (reason DependencyNotReady) are
# skipped: one failure alerts once, not once per resource that depends on it.
# HelmRelease/Kustomization use ready!="True" (False or Unknown) over 30m: a
# stuck reconcile flips between the two, which would keep resetting a 'False' timer.
# Runbooks: runbooks/cluster/gitops-release.md
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux
  annotations:
    # Rule templates use $labels: keep Flux variable substitution away from them
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  groups:
    - name: flux.rules
      rules:
        - alert: FluxHelmReleaseRolledBack
          # Flux rolled a failed install/upgrade back by itself (upgrade.remediation).
          # The cluster runs the previous version, the update in Git did not go in.
          expr: |
            label_replace(
              max by (exported_namespace, name) (
                gotk_resource_info{customresource_kind="HelmRelease", remediated="True", suspended!="true"}
              ),
              "namespace", "$1", "exported_namespace", "(.*)"
            ) == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: HelmRelease {{ $labels.namespace }}/{{ $labels.name }} upgrade failed and was rolled back
            description: >-
              Flux rolled HelmRelease {{ $labels.namespace }}/{{ $labels.name }} back to the previous release after
              a failed install or upgrade. The cluster still runs the old version; the version in Git did not go in.
              Usually a recently merged update (check for a Renovate automerge). Runbook GITOPS-009.
            runbook: GITOPS-009
            runbook_url: https://github.com/marmila/picluster/blob/master/runbooks/cluster/gitops-release.md#runbook-gitops-009

        - alert: FluxHelmReleaseNotReady
          expr: |
            label_replace(
              max by (exported_namespace, name) (
                gotk_resource_info{customresource_kind="HelmRelease", ready!="True", reason!="DependencyNotReady", remediated!="True", suspended!="true"}
              ),
              "namespace", "$1", "exported_namespace", "(.*)"
            ) == 1
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: HelmRelease {{ $labels.namespace }}/{{ $labels.name }} is not Ready
            description: >-
              HelmRelease {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for 30 minutes.
              Usually a failed install or upgrade after an update was merged.
              Check: kubectl -n {{ $labels.namespace }} describe helmrelease {{ $labels.name }}. Runbook GITOPS-003.
            runbook: GITOPS-003
            runbook_url: https://github.com/marmila/picluster/blob/master/runbooks/cluster/gitops-release.md#runbook-gitops-003

        - alert: FluxKustomizationNotReady
          expr: |
            label_replace(
              max by (exported_namespace, name) (
                gotk_resource_info{customresource_kind="Kustomization", ready!="True", reason!="DependencyNotReady", suspended!="true"}
              ),
              "namespace", "$1", "exported_namespace", "(.*)"
            ) == 1
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: Kustomization {{ $labels.namespace }}/{{ $labels.name }} is not Ready
            description: >-
              Flux Kustomization {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for 30 minutes,
              so changes in Git are not being applied (or a dependency failed).
              Check: kubectl -n {{ $labels.namespace }} describe kustomization {{ $labels.name }}. Runbook GITOPS-002.
            runbook: GITOPS-002
            runbook_url: https://github.com/marmila/picluster/blob/master/runbooks/cluster/gitops-release.md#runbook-gitops-002

        - alert: FluxInstanceNotReady
          # The Flux operator cannot install or upgrade Flux itself. The running controllers
          # keep working, but Flux cannot be upgraded or repaired until this is fixed.
          # 2026-11-09: Flux 2.10.0 merged while flux-operator 0.60.0 only knew 2.9 (BuildFailed).
          expr: |
            label_replace(
              max by (exported_namespace, name, reason) (
                gotk_resource_info{customresource_kind="FluxInstance", ready!="True"}
              ),
              "namespace", "$1", "exported_namespace", "(.*)"
            ) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: FluxInstance {{ $labels.namespace }}/{{ $labels.name }} is not Ready ({{ $labels.reason }})
            description: >-
              The Flux operator cannot apply FluxInstance {{ $labels.namespace }}/{{ $labels.name }} (reason {{ $labels.reason }}).
              Flux keeps running the previous version but cannot be upgraded or repaired.
              Check: kubectl -n {{ $labels.namespace }} get fluxinstance {{ $labels.name }} -o yaml. Runbook GITOPS-008.
            runbook: GITOPS-008
            runbook_url: https://github.com/marmila/picluster/blob/master/runbooks/cluster/gitops-release.md#runbook-gitops-008

        - alert: FluxSourceNotReady
          expr: |
            label_replace(
              max by (exported_namespace, name, customresource_kind) (
                gotk_resource_info{customresource_kind=~"GitRepository|OCIRepository|HelmRepository|HelmChart|Bucket", ready="False", suspended!="true"}
              ),
              "namespace", "$1", "exported_namespace", "(.*)"
            ) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Flux {{ $labels.customresource_kind }} {{ $labels.namespace }}/{{ $labels.name }} cannot be fetched
            description: >-
              Flux {{ $labels.customresource_kind }} {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for 15 minutes.
              Flux cannot fetch the Git repo, chart or image it points to (wrong version, registry down, auth).
              Check: kubectl -n {{ $labels.namespace }} describe {{ $labels.customresource_kind }} {{ $labels.name }}. Runbook GITOPS-001.
            runbook: GITOPS-001
            runbook_url: https://github.com/marmila/picluster/blob/master/runbooks/cluster/gitops-release.md#runbook-gitops-001

        - alert: FluxResourceSuspended
          expr: |
            label_replace(
              max by (exported_namespace, name, customresource_kind) (
                gotk_resource_info{suspended="true"}
              ),
              "namespace", "$1", "exported_namespace", "(.*)"
            ) == 1
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: Flux {{ $labels.customresource_kind }} {{ $labels.namespace }}/{{ $labels.name }} suspended for over a day
            description: >-
              Flux {{ $labels.customresource_kind }} {{ $labels.namespace }}/{{ $labels.name }} has been suspended for more than 24 hours,
              so it no longer follows Git. Resume it once the fix is done:
              kubectl -n {{ $labels.namespace }} patch {{ $labels.customresource_kind }} {{ $labels.name }} --type merge -p '{"spec":{"suspend":false}}'.
              Runbook GITOPS-004.
            runbook: GITOPS-004
            runbook_url: https://github.com/marmila/picluster/blob/master/runbooks/cluster/gitops-release.md#runbook-gitops-004
