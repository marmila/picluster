# prometheus-blackbox-exporter helm values (base)
#
# Probes TLS endpoints outside the cluster (Vault, RustFS, OpenWrt gateway) so
# Prometheus can alert before their Let's Encrypt certificates expire. Those
# certificates are issued by Ansible playbooks, not cert-manager, so nothing
# else watches them. Targets are defined per environment in the overlays.
#
# Also probes web UIs through the Envoy gateway (targets named web-*), so an
# update that breaks the gateway, Istio or Cilium shows up even when Flux
# reports everything Ready (web-rules.yaml).

config:
  modules:
    # TLS handshake only, no HTTP request: works for any TLS port and does not
    # depend on what each service answers on "/".
    # insecure_skip_verify keeps probe_ssl_earliest_cert_expiry reported even
    # after a certificate has expired, so an expired certificate shows up as
    # "expired" rather than only as "unreachable".
    tls_connect:
      prober: tcp
      timeout: 10s
      tcp:
        tls: true
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: true
    # Vault /v1/sys/health answers 200 only when Vault is initialized, unsealed
    # and active (503 sealed, 501 not initialized). A sealed Vault still
    # completes the TLS handshake, so tls_connect alone cannot see it.
    # Certificate problems are left to tls_connect (insecure_skip_verify).
    vault_health:
      prober: http
      timeout: 10s
      http:
        method: GET
        valid_status_codes: [200]
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: true

    # Web UI through the gateway: the gateway answers and the backend is not
    # failing. Redirects (SSO login) and 401/403 count as up; connection errors,
    # timeouts and 5xx (e.g. Envoy 503 "no healthy upstream") count as down.
    # insecure_skip_verify: certificate expiry is alerted separately (cert-manager
    # rules, plus web-grafana in certificate-rules.yaml for the served certificate).
    http_reachable:
      prober: http
      timeout: 10s
      http:
        method: GET
        follow_redirects: false
        valid_status_codes: [200, 301, 302, 303, 307, 308, 401, 403]
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

serviceMonitor:
  # One ServiceMonitor per entry in serviceMonitor.targets (set in overlays)
  enabled: true
  defaults:
    module: tls_connect
    interval: 60s
    scrapeTimeout: 30s
