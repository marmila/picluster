---
# Alerts for TLS endpoints outside the cluster, probed by the blackbox exporter.
# Labels on every series: target (short name, e.g. vault), instance (host:port).
# Target vault-health is the Vault seal probe (vault-rules.yaml), excluded here.
# Targets web-* are web UIs behind the Envoy gateway (web-rules.yaml), excluded
# here except web-grafana: every web UI is served with the same wildcard
# certificate (pi-cluster-tls, cert-manager), so one target checks the
# certificate browsers actually receive. cert-manager's own alerts only see the
# Secret, not what Envoy serves. Add any new web-* target to the exclude regex.
#
# Let's Encrypt certificates last 90 days. On 2026-11-07 the Vault and RustFS
# certificates expired unnoticed and broke ExternalSecrets and CNPG backups.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certificates-external
spec:
  groups:
  - name: certificates-external
    rules:
    - alert: TLSCertificateExpiringSoon
      expr: |
        (probe_ssl_earliest_cert_expiry{target!~"vault-health|web-(keycloak|prometheus|threatmap)"} - time()) < 14 * 86400
        and
        (probe_ssl_earliest_cert_expiry{target!~"vault-health|web-(keycloak|prometheus|threatmap)"} - time()) >= 3 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: TLS certificate expires in less than 14 days.
        description: 'The certificate of {{ $labels.target }} ({{ $labels.instance }}) expires in {{ $value | humanizeDuration }}. {{ if eq $labels.target "web-grafana" }}It is the gateway wildcard certificate (cert-manager): check that cert-manager renewed it and that Envoy serves the new one. Runbook NET-007.{{ else }}Renew it with the matching make target (deploy-vault, deploy-rustfs, openwrt-certbot-tls). Runbook NET-009.{{ end }}'
        runbook: '{{ if eq $labels.target "web-grafana" }}NET-007{{ else }}NET-009{{ end }}'
        runbook_url: '{{ if eq $labels.target "web-grafana" }}https://github.com/marmila/picluster/blob/master/runbooks/components/networking-ingress.md#runbook-net-007{{ else }}https://github.com/marmila/picluster/blob/master/runbooks/components/networking-ingress.md#runbook-net-009{{ end }}'
    - alert: TLSCertificateExpiringCritical
      expr: |
        (probe_ssl_earliest_cert_expiry{target!~"vault-health|web-(keycloak|prometheus|threatmap)"} - time()) < 3 * 86400
        and
        (probe_ssl_earliest_cert_expiry{target!~"vault-health|web-(keycloak|prometheus|threatmap)"} - time()) > 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: TLS certificate expires in less than 3 days.
        description: 'The certificate of {{ $labels.target }} ({{ $labels.instance }}) expires in {{ $value | humanizeDuration }}. {{ if eq $labels.target "web-grafana" }}It is the gateway wildcard certificate (cert-manager): check that cert-manager renewed it and that Envoy serves the new one. Runbook NET-007.{{ else }}Renew it now with the matching make target (deploy-vault, deploy-rustfs, openwrt-certbot-tls). Runbook NET-009.{{ end }}'
        runbook: '{{ if eq $labels.target "web-grafana" }}NET-007{{ else }}NET-009{{ end }}'
        runbook_url: '{{ if eq $labels.target "web-grafana" }}https://github.com/marmila/picluster/blob/master/runbooks/components/networking-ingress.md#runbook-net-007{{ else }}https://github.com/marmila/picluster/blob/master/runbooks/components/networking-ingress.md#runbook-net-009{{ end }}'
    - alert: TLSCertificateExpired
      expr: |
        (probe_ssl_earliest_cert_expiry{target!~"vault-health|web-(keycloak|prometheus|threatmap)"} - time()) <= 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: TLS certificate has expired.
        description: 'The certificate of {{ $labels.target }} ({{ $labels.instance }}) has expired. Clients that verify certificates (External Secrets, CNPG backups, browsers) are failing. {{ if eq $labels.target "web-grafana" }}It is the gateway wildcard certificate (cert-manager): check that cert-manager renewed it and that Envoy serves the new one. Runbook NET-007.{{ else }}Renew it with the matching make target (deploy-vault, deploy-rustfs, openwrt-certbot-tls). Runbook NET-009.{{ end }}'
        runbook: '{{ if eq $labels.target "web-grafana" }}NET-007{{ else }}NET-009{{ end }}'
        runbook_url: '{{ if eq $labels.target "web-grafana" }}https://github.com/marmila/picluster/blob/master/runbooks/components/networking-ingress.md#runbook-net-007{{ else }}https://github.com/marmila/picluster/blob/master/runbooks/components/networking-ingress.md#runbook-net-009{{ end }}'
    # web-* stay excluded: reachability of the web UIs is WebEndpointDown (web-rules.yaml)
    - alert: ExternalEndpointDown
      expr: |
        probe_success{target!="vault-health", target!~"web-.*"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: External TLS endpoint is not reachable.
        description: '{{ $labels.target }} ({{ $labels.instance }}) has not completed a TLS handshake for 5 minutes. Check the service on its host (systemctl status), the network, and DNS. If the certificate has expired, use NET-009. Runbook {{ if eq $labels.target "vault" }}VAULT-001{{ else if eq $labels.target "object-store" }}MINIO-001{{ else }}NET-009{{ end }}.'
        runbook: '{{ if eq $labels.target "vault" }}VAULT-001{{ else if eq $labels.target "object-store" }}MINIO-001{{ else }}NET-009{{ end }}'
        runbook_url: '{{ if eq $labels.target "vault" }}https://github.com/marmila/picluster/blob/master/runbooks/components/vault.md#runbook-vault-001{{ else if eq $labels.target "object-store" }}https://github.com/marmila/picluster/blob/master/runbooks/components/s3-storage.md#runbook-minio-001{{ else }}https://github.com/marmila/picluster/blob/master/runbooks/components/networking-ingress.md#runbook-net-009{{ end }}'
