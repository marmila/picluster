---
# Alerts for TLS endpoints outside the cluster, probed by the blackbox exporter.
# Labels on every series: target (short name, e.g. vault), instance (host:port).
#
# Let's Encrypt certificates last 90 days. On 2026-11-07 the Vault and RustFS
# certificates expired unnoticed and broke ExternalSecrets and CNPG backups.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certificates-external
spec:
  groups:
  - name: certificates-external
    rules:
    - alert: TLSCertificateExpiringSoon
      expr: |
        (probe_ssl_earliest_cert_expiry - time()) < 14 * 86400
        and
        (probe_ssl_earliest_cert_expiry - time()) >= 3 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: TLS certificate expires in less than 14 days.
        description: The certificate of {{ $labels.target }} ({{ $labels.instance }}) expires in {{ $value | humanizeDuration }}. Renew it with the matching make target (deploy-vault, deploy-rustfs, openwrt-certbot-tls).
    - alert: TLSCertificateExpiringCritical
      expr: |
        (probe_ssl_earliest_cert_expiry - time()) < 3 * 86400
        and
        (probe_ssl_earliest_cert_expiry - time()) > 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: TLS certificate expires in less than 3 days.
        description: The certificate of {{ $labels.target }} ({{ $labels.instance }}) expires in {{ $value | humanizeDuration }}. Renew it now with the matching make target (deploy-vault, deploy-rustfs, openwrt-certbot-tls).
    - alert: TLSCertificateExpired
      expr: |
        (probe_ssl_earliest_cert_expiry - time()) <= 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: TLS certificate has expired.
        description: The certificate of {{ $labels.target }} ({{ $labels.instance }}) has expired. Clients that verify certificates (External Secrets, CNPG backups, browsers) are failing. Renew it with the matching make target (deploy-vault, deploy-rustfs, openwrt-certbot-tls).
    - alert: ExternalEndpointDown
      expr: |
        probe_success == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: External TLS endpoint is not reachable.
        description: '{{ $labels.target }} ({{ $labels.instance }}) has not completed a TLS handshake for 5 minutes. Check the service on its host (systemctl status), the network, and DNS.'
