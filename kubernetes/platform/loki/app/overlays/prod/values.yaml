# loki helm values (prod overlay)

loki:
  commonConfig:
    replication_factor: 1

write:
  replicas: 1
  persistence:
    # 1Gi filled to 98% after the 2026-11 crashes (2026-11-06). The PVC was
    # expanded by hand; changing this needs the StatefulSet orphan-deleted.
    size: 5Gi
  # 200m CPU / 1Gi was 100% CPU-throttled and OOMKilled (2026-11): never became
  # Ready, so no logs were ingested. Give it real CPU and memory headroom.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# Reduce memcached cache sizes from massive defaults (8GB/1GB) to homelab-appropriate values
# Defaults: chunksCache.allocatedMemory=8192, resultsCache.allocatedMemory=1024
chunksCache:
  allocatedMemory: 256
  allocatedCPU: 100m

resultsCache:
  allocatedMemory: 128
  allocatedCPU: 100m

# Resource limits for Loki components — none previously set
# Actual usage: backend 166-257Mi, read 131-167Mi
backend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

read:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 512Mi

gateway:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
